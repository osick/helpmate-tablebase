# Publish the static showcase (site/) to GitHub Pages.
#
# Nothing here needs the tablebases: site/data/*.json is committed, produced
# by hand with tools/build_site_data.py. The only build step is copying the
# dashboard's vendored cm-chessboard into site/vendor (make site), and the
# only gate is the site's own node tests.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/packages/web/helpmate_web/static/vendor/**"
      - ".github/workflows/pages.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble and test the site
        run: make test-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
